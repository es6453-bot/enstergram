name: Finalize daily rounds

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish due Estergram results
        shell: bash
        run: |
          set -euo pipefail
          endpoint=https://estergram.vercel.app/api/rounds/finalize
          token_response=$(curl --silent --show-error --fail --max-time 15 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Festergram.vercel.app%2Fapi%2Frounds%2Ffinalize")
          token=$(jq -er .value <<< "$token_response")
          echo "::add-mask::$token"
          finalize() {
            curl --silent --show-error --fail --retry 2 --max-time 30 \
              --request POST --header "Authorization: Bearer $token" "$endpoint"
          }
          result=$(finalize)
          deadline=$(jq -er '.nextDeadline // 0' <<< "$result")
          remaining=$(( (deadline - $(date +%s%3N) + 999) / 1000 ))
          if (( remaining > 0 && remaining <= 90 )); then
            sleep "$remaining"
            finalize
          else
            printf '%s\n' "$result"
          fi
